<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Matriks - Beta</title>
    <style>
        /* === TEMA ELEGANT DARK MODE === */
        :root {
            --bg-body: #0f172a; 
            --bg-panel: #1e293b; 
            --primary-color: #60a5fa; 
            --primary-hover: #3b82f6; 
            --accent-color: #818cf8; 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --border-color: #334155; 
            --success-color: #34d399;
            --danger-color: #f87171;
            --info-color: #38bdf8;
            --table-bg: #1e293b;
            --table-alt: #0f172a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            padding: 20px 10px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        header h1 {
            margin: 0;
            color: var(--primary-color);
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.8em; 
        }

        /* Dropdown Bahasa */
        .lang-selector { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); }
        .lang-selector select {
            background: var(--bg-body); 
            color: var(--text-main); 
            border: 1px solid var(--border-color);
            padding: 6px 12px; 
            border-radius: 6px; 
            font-weight: 600; 
            outline: none; 
            cursor: pointer;
            transition: border 0.3s;
        }
        .lang-selector select:hover {
            border-color: var(--primary-color);
        }

        .container {
            display: flex; max-width: 1200px; margin: 30px auto; padding: 0 15px; 
            gap: 25px; flex-direction: row; align-items: flex-start;
        }

        .main-content {
            flex: 3; 
            background: var(--bg-panel); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 30px; 
            min-height: 600px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%; box-sizing: border-box; overflow: hidden; 
        }

        .sidebar {
            flex: 1; 
            background: var(--bg-panel); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 20px;
            height: fit-content; 
            min-width: 250px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            width: 100%; box-sizing: border-box;
        }

        /* Responsif HP */
        @media screen and (max-width: 768px) {
            .container { flex-direction: column-reverse; margin: 15px auto; }
            .sidebar { min-width: 100%; margin-bottom: 30px; }
            .main-content { min-height: auto; padding: 20px; }
            header h1 { font-size: 1.5em; text-align: left; padding-left: 10px;}
            .lang-selector { right: 10px; }
            .flex-center { flex-direction: column; gap: 10px; }
            .flex-center button { width: 100%; }
        }

        h2 { 
            color: var(--primary-color); 
            border-bottom: 2px solid var(--bg-body); 
            padding-bottom: 12px; 
            margin-top: 0; 
            font-weight: 600;
        }
        p { color: var(--text-muted); }
        
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar li { margin-bottom: 8px; }
        .sidebar a {
            display: block; color: var(--text-muted); text-decoration: none; padding: 10px 15px; 
            border-radius: 8px; transition: all 0.2s ease; font-weight: 500;
        }
        .sidebar a:hover, .sidebar a.active { 
            background-color: var(--bg-body); 
            color: var(--primary-color); 
        }

        .setup-box, .matrix-input-box { 
            background: var(--bg-body); 
            border: 1px solid var(--border-color); 
            padding: 20px; 
            border-radius: 10px; 
            margin-top: 20px; 
            overflow-x: auto; 
        }
        
        .scroll-wrapper { 
            overflow: auto; max-height: 60vh; max-width: 100%; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; padding: 15px; 
            background: var(--bg-panel); 
        }

        input[type="number"] {
            background-color: var(--bg-body); 
            border: 1px solid var(--border-color);
            color: var(--text-main); 
            padding: 8px 6px; 
            border-radius: 6px; 
            width: 55px; 
            text-align: center;
            font-weight: 500;
            transition: all 0.2s;
        }
        input[type="number"]:focus { 
            outline: none; 
            border-color: var(--primary-color); 
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); 
        }
        
        button {
            background-color: #334155; 
            color: var(--text-main); 
            border: 1px solid var(--border-color);
            padding: 10px 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.2s; 
            margin: 0 5px; 
            box-sizing: border-box; 
        }
        button:hover { 
            background-color: #475569; 
        }
        button.primary { 
            background-color: #2563eb; 
            color: white; 
            border-color: #2563eb; 
        }
        button.primary:hover { 
            background-color: #1d4ed8; 
            border-color: #1d4ed8;
        }
        button.auto { 
            color: #c7d2fe; 
            background-color: #312e81; 
            border-color: #3730a3;
            font-size: 0.9em; 
            padding: 10px 15px;
        }
        button.auto:hover { 
            background-color: #3730a3; 
        }

        .grid-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; width: max-content; }
        .flex-center { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px;}
        
        .matrix-table { 
            margin: 0 auto; 
            border-collapse: collapse; 
            background-color: var(--table-bg); 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
        }
        .matrix-table th, .matrix-table td { 
            border: 1px solid var(--border-color); 
            padding: 10px 15px; 
            text-align: center; 
            min-width: 40px; 
            color: var(--text-main);
            font-weight: 500;
        }
        .matrix-table th { background-color: var(--bg-body); font-weight: 600; }
        .matrix-table tr:nth-child(even) td { background-color: var(--table-alt); }
        .matrix-table td.divider { border-left: 2px dashed #475569; }

        .step-panel { 
            background: var(--bg-panel); 
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color); 
            border-radius: 8px; 
            padding: 20px; 
            margin-top: 20px; 
            text-align: center; 
            overflow-x: auto; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .step-title { color: var(--text-main); margin-bottom: 15px; font-size: 1em; font-weight: 600; }
        
        .result-box { 
            margin-top: 20px; 
            padding: 20px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            background: var(--bg-body); 
            text-align: center; 
            font-size: 1.1em; 
            overflow: auto; 
            max-height: 40vh;
            color: var(--text-main);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .toggle-container { margin-top: 15px; text-align: center; color: var(--text-muted); font-weight: 500; font-size: 0.95em; }
        .toggle-container input { transform: scale(1.2); margin-right: 8px; accent-color: var(--primary-color); }
        
        .method-desc { 
            background: var(--bg-body); 
            border-left: 4px solid var(--accent-color); 
            padding: 15px 20px; 
            border-radius: 6px; 
            margin-bottom: 25px; 
            font-size: 0.95em; 
            text-align: justify; 
            color: var(--text-muted);
        }
        
        .dim-input-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; font-weight: 500;}
        .dim-input-group span { color: var(--text-muted); }
    </style>
</head>

        // === STATE VARIABLES ===
        let lang = 'id';
        let mode = 'home';
        let rows = 2, cols = 3;

        function t(k) { return tr[lang][k] || k; }

        function changeLanguage() { 
            lang = document.getElementById('languageSelect').value; 
            document.querySelectorAll('.sidebar a').forEach(e => { 
                let k = e.getAttribute('data-lang'); 
                if(tr[lang][k]) e.innerText = tr[lang][k]; 
            }); 
            navigate(mode); 
        }

        // === FUNGSI NAVIGASI ===
        function navigate(m) {
            mode = m; 
            document.querySelectorAll('.sidebar a').forEach(e => e.classList.remove('active')); 
            if(document.getElementById('nav-' + m)) document.getElementById('nav-' + m).classList.add('active');
            
            let c = document.getElementById('app-content');
            
            if(m === 'home') {
                c.innerHTML = `
                    <h2>Zero Matrix System</h2>
                    <div class="setup-box">
                        <p style="color:var(--text-main);">
                        ✓ <b>Multi-Language:</b> ID, EN, JP.<br><br>
                        ✓ <b>Unrestricted Engine:</b> Merender <i>Step-by-step</i> secara instan untuk ordo apa pun tanpa <i>lazy loading</i>.<br><br>
                        ✓ <b>Smart RREF:</b> Deteksi cerdas untuk matriks dengan Solusi Tak Terhingga & Tidak Ada Solusi.</p>
                    </div>`; 
                return;
            }

            let isSq = (m === 'det' || m === 'inv' || m === 'cofactor');
            let isCr = (m === 'cramer');
            let isDbl = (m === 'addsub');
            
            let html = `<h2>${t('nav_'+m)}</h2>
                        <div class="method-desc">${t('desc_'+m)}</div>
                        <div class="setup-box"><div class="dim-input-group">`;
            
            if(isSq) {
                html += `<span>${t('ui_size')}</span>
                         <input type="number" id="dim-n" value="${rows}" min="1" max="100">
                         <span>x</span><span id="dim-n-disp">${rows}</span>
                         <button class="primary" onclick="buildGrid('sq')">${t('ui_set')}</button>`;
            }
            else if(isCr) { 
                let v = cols - 1; 
                html += `<span>${t('ui_var')}</span>
                         <input type="number" id="dim-n" value="${v}" min="1" max="100">
                         <button class="primary" onclick="buildGrid('cr')">${t('ui_set')}</button>`; 
            }
            else {
                html += `<span>${t('ui_row')}</span>
                         <input type="number" id="dim-row" value="${rows}" min="1" max="100">
                         <span>${t('ui_col')}</span>
                         <input type="number" id="dim-col" value="${cols}" min="1" max="100">
                         <button class="primary" onclick="buildGrid('${isDbl?'db':'sg'}')">${t('ui_set')}</button>`;
            }
            
            c.innerHTML = html + `</div></div><div id="matrix-input-area"></div><div id="solution-area"></div>`;
            
            if(isSq || isCr) {
                document.getElementById('dim-n').addEventListener('input', function() { 
                    let d = document.getElementById('dim-n-disp'); 
                    if(d) d.innerText = this.value; 
                });
            }
            buildGrid(isSq ? 'sq' : isCr ? 'cr' : isDbl ? 'db' : 'sg');
        }

        // === FUNGSI MEMBANGUN GRID INPUT ===
        function buildGrid(type) {
            document.getElementById('solution-area').innerHTML = '';
            
            if(type === 'sq') { rows = cols = parseInt(document.getElementById('dim-n').value); } 
            else if(type === 'cr') { rows = parseInt(document.getElementById('dim-n').value); cols = rows + 1; } 
            else { rows = parseInt(document.getElementById('dim-row').value); cols = parseInt(document.getElementById('dim-col').value); }
            
            if(rows > 100 || cols > 100) return alert(t('alert_max'));
            
            let html = `<div class="matrix-input-box">`;
            if(type === 'db') {
                html += `
                    <div style="display:flex; justify-content:space-around; flex-wrap:wrap; gap:20px;">
                        <div><h3 style="color:var(--primary-color); text-align:center;">${t('mat_a')}</h3>${genHTML('A', rows, cols)}</div>
                        <div><h3 style="color:var(--primary-color); text-align:center;">${t('mat_b')}</h3>${genHTML('B', rows, cols)}</div>
                    </div>
                    <div class="flex-center">
                        <button class="auto" onclick="aF('A',1); aF('B',1);">${t('btn_auto_pm')}</button>
                        <button class="auto" onclick="aF('A',0); aF('B',0);">${t('btn_auto_p')}</button>
                        <button onclick="cM('A'); cM('B');">${t('ui_clrall')}</button>
                        <button class="primary" onclick="solve('add')">A + B</button>
                        <button class="primary" onclick="solve('sub')">A - B</button>
                    </div>`;
            } else {
                html += `
                    <h3 style="color:var(--primary-color); text-align:center;">${t('ui_in')}</h3>
                    ${genHTML('A', rows, cols)}
                    <div class="flex-center">
                        <button class="auto" onclick="aF('A',1)">${t('btn_auto_pm')}</button>
                        <button class="auto" onclick="aF('A',0)">${t('btn_auto_p')}</button>
                        <button onclick="cM('A')">${t('ui_clr')}</button>
                        <button class="primary" onclick="solve('${mode}')">${t('ui_calc')}</button>
                    </div>`;
            }
            document.getElementById('matrix-input-area').innerHTML = html + `
                <div class="toggle-container">
                    <label><input type="checkbox" id="show-steps" checked> ${t('ui_step')}</label>
                </div></div>`;
        }

        function genHTML(pf, r, c) { 
            let h = `<div class="scroll-wrapper"><div style="display:inline-flex; flex-direction:column; align-items:center;">`; 
            for(let i=0; i<r; i++) { 
                h += `<div class="grid-row">`; 
                for(let j=0; j<c; j++) h += `<input type="number" id="c_${pf}_${i}_${j}" placeholder="0">`; 
                h += `</div>`; 
            } 
            return h + `</div></div>`; 
        }

        function cM(pf) { 
            for(let i=0; i<rows; i++) {
                for(let j=0; j<cols; j++) { 
                    let c = document.getElementById(`c_${pf}_${i}_${j}`); 
                    if(c) c.value = ''; 
                } 
            }
            document.getElementById('solution-area').innerHTML = ''; 
        }

        function aF(pf, neg) { 
            for(let i=0; i<rows; i++) {
                for(let j=0; j<cols; j++) { 
                    let c = document.getElementById(`c_${pf}_${i}_${j}`); 
                    if(c) c.value = neg ? Math.floor(Math.random() * 19) - 9 : Math.floor(Math.random() * 10); 
                } 
            }
        }

        function getM(pf, r, c) { 
            let m = []; 
            for(let i=0; i<r; i++) { 
                let rw = []; 
                for(let j=0; j<c; j++) { 
                    let v = parseFloat(document.getElementById(`c_${pf}_${i}_${j}`).value); 
                    rw.push(isNaN(v) ? 0 : v); 
                } 
                m.push(rw); 
            } 
            return m; 
        }

        // FUNGSI KONVERSI DESIMAL KE PECAHAN
        function fN(n) { 
            if(typeof n === 'string') return n;
            if(Math.abs(n) < 1e-10) return "0";
            if(Math.abs(n) > 1e10) return n.toExponential(3); 
            
            let sign = n < 0 ? "-" : "";
            let val = Math.abs(n);
            
            // Cek apakah angka sudah mendekati bulat (integer)
            if(Math.abs(val - Math.round(val)) < 1e-10) return sign + Math.round(val);
            
            // Algoritma konversi ke Pecahan (Continued Fraction)
            let h1 = 1, h2 = 0, k1 = 0, k2 = 1;
            let b = val;
            for(let i = 0; i < 30; i++) {
                let a = Math.floor(b);
                let auxH = h1; h1 = a * h1 + h2; h2 = auxH;
                let auxK = k1; k1 = a * k1 + k2; k2 = auxK;
                
                // Jika akurasinya tinggi (selisih kecil), pakai bentuk pecahannya
                if (Math.abs(val - (h1 / k1)) < 1e-7) {
                    if (k1 === 1) return sign + h1;
                    return sign + h1 + "/" + k1;
                }
                
                if (Math.abs(b - a) < 1e-10) break;
                b = 1 / (b - a);
            }
            
            // Fallback (jika gagal jadi pecahan rapi, pakai format desimal biasa)
            return sign + parseFloat(val.toFixed(4)); 
        }

        function rT(m, title, isA=false, dI=-1) { 
            let h = `<div class="step-panel step-render"><div class="step-title">${title}</div><div style="overflow-x:auto;"><table class="matrix-table"><tbody>`; 
            m.forEach(r => { 
                h += `<tr>`; 
                r.forEach((v,i) => {
                    h += `<td ${(isA && i === dI) ? 'class="divider"' : ''}>${fN(v)}</td>`;
                }); 
                h += `</tr>`; 
            }); 
            return h + `</tbody></table></div></div>`; 
        }

        function cln(m) { return JSON.parse(JSON.stringify(m)); }

        // Fungsi determinan tersembunyi (dipakai oleh Cramer / Cofactor agar logikanya tidak kepanjangan)
        function cD(m) { 
            if(!m.length) return 0; 
            if(m.length === 1) return m[0][0]; 
            
            let mt = cln(m), n = mt.length, d = 1; 
            for(let i=0; i<n; i++) { 
                let p = mt[i][i]; 
                if(Math.abs(p) < 1e-10) { 
                    let s = false; 
                    for(let k=i+1; k<n; k++) {
                        if(Math.abs(mt[k][i]) > 1e-10) { 
                            let tp = mt[i]; mt[i] = mt[k]; mt[k] = tp; 
                            d *= -1; p = mt[i][i]; s = true; break; 
                        } 
                    }
                    if(!s) return 0; 
                } 
                for(let k=i+1; k<n; k++) { 
                    let f = mt[k][i]/p; 
                    for(let j=i; j<n; j++) mt[k][j] -= f * mt[i][j]; 
                } 
                d *= mt[i][i]; 
            } 
            return d; 
        }

        // === FUNGSI MATEMATIKA UTAMA (DIRECT RENDER - TANPA LAZY) ===
        function solve(op) {
            let A = getM('A', rows, cols);
            let s = document.getElementById('solution-area');
            let showSteps = document.getElementById('show-steps').checked;
            
            let htmlOut = `<h3 style="margin-top:40px; color:var(--primary-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px;">${t('ui_log')}</h3>`;
            
            // --- ADD / SUBTRACT ---
            if (op === 'add' || op === 'sub') {
                let B = getM('B', rows, cols);
                let C = [], SM = [];
                let sign = (op === 'add') ? '+' : '-';
                
                for(let i=0; i<rows; i++) { 
                    let rC = [], rS = []; 
                    for(let j=0; j<cols; j++) { 
                        let val = (op === 'add') ? (A[i][j] + B[i][j]) : (A[i][j] - B[i][j]);
                        rC.push(val); 
                        if(showSteps) rS.push(`${fN(A[i][j])} ${sign} ${fN(B[i][j])}`); 
                    } 
                    C.push(rC); 
                    if(showSteps) SM.push(rS); 
                }
                if(showSteps) { htmlOut += rT(A, t('mat_a')) + rT(B, t('mat_b')) + rT(SM, t('step_proc')); } 
                htmlOut += rT(C, `${t('step_res')} (A ${sign} B)`);
            
            // --- TRANSPOSE ---
            } else if (op === 'trans') {
                let C = []; 
                for(let j=0; j<cols; j++) { 
                    let rw = []; 
                    for(let i=0; i<rows; i++) { rw.push(A[i][j]); }
                    C.push(rw); 
                }
                if(showSteps) htmlOut += rT(A, t('step_init')); 
                htmlOut += rT(C, `${t('step_res')} (${cols}x${rows})`);

            // --- GAUSS-JORDAN ELIMINATION (DENGAN EVALUASI SOLUSI) ---
            } else if (op === 'gauss') {
                let m = cln(A); 
                if(showSteps) htmlOut += rT(m, t('step_init'));
                
                let r = rows, c = cols, lead = 0;
                for(let rt=0; rt<r; rt++) { 
                    if(c <= lead) break; 
                    let i = rt; 
                    while(Math.abs(m[i][lead]) < 1e-10) { 
                        i++; 
                        if(r === i) { i = rt; lead++; if(c === lead) break; } 
                    } 
                    if(c === lead) break;
                    
                    if(i !== rt) { 
                        let tp = m[i]; m[i] = m[rt]; m[rt] = tp; 
                        if(showSteps) htmlOut += rT(cln(m), t('step_swap')); 
                    }
                    
                    let p = m[rt][lead]; 
                    if(Math.abs(p) > 1e-10) { 
                        for(let j=0; j<c; j++) { m[rt][j] /= p; }
                        if(showSteps && Math.abs(p - 1) > 1e-10) htmlOut += rT(cln(m), t('step_div').replace('{r}', rt+1).replace('{p}', fN(p))); 
                    }
                    
                    let eli = false; 
                    for(let k=0; k<r; k++) { 
                        if(k !== rt) { 
                            let f = m[k][lead]; 
                            if(Math.abs(f) > 1e-10) { 
                                for(let j=0; j<c; j++) { m[k][j] -= f * m[rt][j]; }
                                eli = true; 
                            } 
                        } 
                    }
                    if(showSteps && eli) htmlOut += rT(cln(m), t('step_elim').replace('{c}', lead+1)); 
                    lead++;
                }

                if(!showSteps) htmlOut += rT(m, t('step_res'));
                
                // Evaluasi Tipe Solusi (Unik, Infinite, Tidak Ada Solusi)
                let isConsistent = true;
                let rankA = 0;
                
                for(let i=0; i<rows; i++) {
                    let allZeroA = true;
                    for(let j=0; j<cols-1; j++) {
                        if (Math.abs(m[i][j]) > 1e-10) { allZeroA = false; break; }
                    }
                    let bZero = Math.abs(m[i][cols-1]) <= 1e-10;
                    
                    if (!allZeroA) {
                        rankA++;
                    } else if (!bZero) {
                        isConsistent = false;
                        break;
                    }
                }
                
                htmlOut += `<div class="result-box">`;
                
                if (!isConsistent) {
                    htmlOut += `<h4 style="margin:0 0 10px 0; color:var(--danger-color);">${t('no_sol')}</h4>`;
                } else if (rankA < cols - 1) {
                    htmlOut += `<h4 style="margin:0 0 10px 0; color:var(--info-color);">${t('inf_sol')}</h4>`;
                }
                
                htmlOut += `<h4 style="margin:0; color:var(--primary-color); padding-bottom:10px;">${t('step_eq')}</h4>`; 
                
                for(let i=0; i<rows; i++) { 
                    let val = fN(m[i][cols-1]);
                    if (Math.abs(val) < 1e-10) val = 0;
                    htmlOut += `X<sub>${i+1}</sub> = <b>${val}</b><br>`; 
                }
                
                htmlOut += `</div>`;

            // --- MATRIX RANK ---
            } else if (op === 'rank') {
                let m = cln(A); 
                if(showSteps) htmlOut += rT(m, t('step_init')); 
                
                let rk = cols;
                for(let rw=0; rw<rk; rw++) { 
                    if(Math.abs(m[rw][rw]) > 1e-10) { 
                        for(let c=0; c<rows; c++) { 
                            if(c !== rw) { 
                                let mt = m[c][rw]/m[rw][rw]; 
                                for(let i=0; i<rk; i++) { m[c][i] -= mt * m[rw][i]; }
                            } 
                        } 
                        if(showSteps && rw < rows-1) htmlOut += rT(cln(m), t('step_elim_pivot')); 
                    }
                    else { 
                        let rd = true; 
                        for(let i=rw+1; i<rows; i++) { 
                            if(Math.abs(m[i][rw]) > 1e-10) { 
                                let tp = m[rw]; m[rw] = m[i]; m[i] = tp; 
                                if(showSteps) htmlOut += rT(cln(m), t('step_swap')); 
                                rd = false; break; 
                            } 
                        } 
                        if(rd) { rk--; for(let i=0; i<rows; i++) { m[i][rw] = m[i][rk]; } } 
                        rw--; 
                    } 
                }
                htmlOut += `<div class="result-box">Rank = <b style="color:var(--primary-color);">${rk}</b></div>`;

            // --- DETERMINANT (Dengan Langkah Segitiga Atas) ---
            } else if (op === 'det') {
                let m = cln(A);
                let n = rows;
                if(showSteps) htmlOut += rT(m, t('step_init')); 
                
                let detSign = 1;
                let isZero = false;
                
                for(let i=0; i<n; i++) {
                    let pivot = m[i][i];
                    
                    // Jika pivot 0, cari baris di bawahnya untuk di-swap
                    if(Math.abs(pivot) < 1e-10) {
                        let swapped = false;
                        for(let k=i+1; k<n; k++) {
                            if(Math.abs(m[k][i]) > 1e-10) {
                                let temp = m[i]; m[i] = m[k]; m[k] = temp;
                                detSign *= -1; // Swap mengubah tanda determinan menjadi kebalikannya
                                pivot = m[i][i];
                                swapped = true;
                                if(showSteps) htmlOut += rT(cln(m), t('step_swap_det').replace('{r1}', i+1).replace('{r2}', k+1));
                                break;
                            }
                        }
                        // Jika tidak ada nilai yang bisa dijadikan pivot, determinan otomatis 0
                        if(!swapped) {
                            isZero = true;
                            break;
                        }
                    }
                    
                    let eliminated = false;
                    for(let k=i+1; k<n; k++) {
                        let factor = m[k][i] / pivot;
                        if(Math.abs(factor) > 1e-10) {
                            for(let j=i; j<n; j++) {
                                m[k][j] -= factor * m[i][j];
                            }
                            eliminated = true;
                        }
                    }
                    if(showSteps && eliminated) htmlOut += rT(cln(m), t('step_elim_det').replace('{c}', i+1));
                }
                
                let finalDet = 1;
                if(isZero) {
                    finalDet = 0;
                    if(showSteps) {
                        htmlOut += `<div class="result-box" style="color:var(--danger-color);">${t('zero_row_col')}</div>`;
                    } else {
                        htmlOut += `<div class="result-box">Determinant = <b style="color:var(--primary-color);">0</b></div>`;
                    }
                } else {
                    let diags = [];
                    for(let i=0; i<n; i++) {
                        finalDet *= m[i][i];
                        diags.push(fN(m[i][i]));
                    }
                    finalDet *= detSign;
                    if(Math.abs(finalDet) < 1e-10) finalDet = 0;
                    
                    if(showSteps) {
                        htmlOut += `<div class="result-box" style="text-align:left; background:var(--bg-panel); border-color:var(--border-color);">
                            <span style="color:var(--primary-color); font-weight:bold;">${t('step_det_tri')}</span><br><br>
                            <span style="color:var(--text-main);">${t('step_det_form')}</span><br>
                            <span style="color:var(--text-muted);">Det = ${detSign < 0 ? '(-1)' : '1'} &times; (${diags.join(' &times; ')})</span><br>
                            <hr style="border-color:var(--border-color); margin:12px 0;">
                            Determinant = <b style="color:var(--primary-color); font-size:1.2em;">${fN(finalDet)}</b>
                        </div>`;
                    } else {
                        htmlOut += `<div class="result-box">Determinant = <b style="color:var(--primary-color);">${fN(finalDet)}</b></div>`;
                    }
                }

            // --- CRAMER'S RULE ---
            } else if (op === 'cramer') {
                let m = cln(A); let n = rows; let D = []; 
                for(let i=0; i<n; i++) { D.push(m[i].slice(0,n)); }
                let detD = cD(D); 
                if(Math.abs(detD) < 1e-10) detD = 0;
                
                if(showSteps) htmlOut += rT(D, t('mat_d'));
                htmlOut += `<div class="result-box" style="padding:15px;">Det(D) = <b>${fN(detD)}</b></div>`;
                
                if(Math.abs(detD) === 0) {
                    htmlOut += `<div class="result-box" style="color:var(--danger-color);">${t('no_sol')} (Det = 0)</div>`;
                } else { 
                    for(let v=0; v<n; v++) { 
                        let Dx = cln(D); 
                        for(let i=0; i<n; i++) { Dx[i][v] = m[i][n]; }
                        let detDx = cD(Dx); 
                        if(Math.abs(detDx) < 1e-10) detDx = 0;
                        
                        if(showSteps) htmlOut += rT(Dx, t('mat_d') + `<sub>${v+1}</sub>`);
                        let x = detDx / detD;
                        if(Math.abs(x) < 1e-10) x = 0;
                        
                        htmlOut += `
                        <div class="result-box" style="margin-top:15px; overflow-x:auto;">
                            Det(D<sub>${v+1}</sub>) = <b>${fN(detDx)}</b><br>
                            <span style="color:var(--primary-color);">X<sub>${v+1}</sub> = Det(D<sub>${v+1}</sub>) / Det(D)</span><br>
                            X<sub>${v+1}</sub> = ${fN(detDx)} / ${fN(detD)} = <b style="font-size:1.1em;">${fN(x)}</b>
                        </div>`; 
                    } 
                }

            // --- COFACTOR MATRIX ---
            } else if (op === 'cofactor') {
                if(rows === 1) { 
                    htmlOut += rT([[1]], t('step_res')); 
                    s.innerHTML = htmlOut; 
                    return; 
                }
                
                let C = []; let MinorMat = []; 
                let st = `<div class="result-box" style="text-align:left; background:var(--bg-body); border-color:var(--border-color);">
                          <h4 style="color:var(--primary-color); margin-top:0;">${t('step_cof1')}</h4>
                          <p style="color:var(--text-main);">C<sub>ij</sub> = (-1)<sup>i+j</sup> &times; Det(M<sub>ij</sub>)</p>
                          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:15px;">`;
                
                if(showSteps) htmlOut += rT(A, t('step_init'));
                
                for(let i=0; i<rows; i++) { 
                    let rC = []; let rM = []; 
                    for(let j=0; j<cols; j++) {
                        let mr = []; 
                        for(let r=0; r<rows; r++) { 
                            if(r === i) continue; 
                            let mR = []; 
                            for(let c=0; c<cols; c++) { 
                                if(c === j) continue; 
                                mR.push(A[r][c]); 
                            } 
                            mr.push(mR); 
                        }
                        
                        let dM = cD(mr);
                        if(Math.abs(dM) < 1e-10) dM = 0;
                        
                        let sg = ((i+j)%2 === 0) ? 1 : -1;
                        let cf = sg * dM;
                        let ds = ""; 
                        
                        if(Math.abs(cf) < 1e-10) cf = 0; 
                        
                        rC.push(cf); 
                        rM.push(dM);
                        
                        if(showSteps) { 
                            if(mr.length === 2) { 
                                let a = mr[0][0], b = mr[0][1], cv = mr[1][0], d = mr[1][1]; 
                                ds = `(${fN(a)} &times; ${fN(d)}) - (${fN(b)} &times; ${fN(cv)})`; 
                            } else if(mr.length === 1) {
                                ds = `${fN(mr[0][0])}`;
                            }
                            
                            let mh = `<div style="overflow-x:auto;"><table class="matrix-table" style="font-size:0.85em; margin:8px 0;"><tbody>`; 
                            mr.forEach(rr => { 
                                mh += `<tr>`; 
                                rr.forEach(v => mh += `<td style="padding:6px; background:var(--table-bg);">${fN(v)}</td>`); 
                                mh += `</tr>`; 
                            }); 
                            mh += `</tbody></table></div>`;
                            
                            st += `<div style="background:var(--bg-panel); padding:15px; border-radius:8px; border:1px solid var(--border-color);">
                                     <span style="color:var(--primary-color); font-weight:bold;">R${i+1}, C${j+1}</span><br>
                                     M = ${mh}
                                     <span style="font-size:0.9em; color:var(--text-muted);">Det(M) = ${ds}</span><br>
                                     M = <b>${fN(dM)}</b><hr style="border-color:var(--border-color); margin:12px 0;">
                                     C = (-1)<sup>${i+1}+${j+1}</sup> &times; M<br>
                                     C = <span style="color:${sg>0?'var(--primary-color)':'var(--danger-color)'}; font-weight:bold;">${sg>0?'(+1)':'(-1)'}</span> &times; ${fN(dM)} = <b style="color:var(--accent-color);">${fN(cf)}</b>
                                   </div>`;
                        }
                    } 
                    C.push(rC); 
                    MinorMat.push(rM);
                }
                
                if(showSteps) { 
                    htmlOut += st + `</div></div>` + rT(MinorMat, t('step_cof2')); 
                    let sM = []; 
                    for(let i=0; i<rows; i++) { 
                        let sr = []; 
                        for(let j=0; j<cols; j++) { sr.push(((i+j)%2 === 0) ? '+' : '-'); } 
                        sM.push(sr); 
                    } 
                    htmlOut += rT(sM, t('step_cof3')); 
                }
                htmlOut += rT(C, t('step_res'));

            // --- INVERSE MATRIX ---
            } else if (op === 'inv') {
                let ag = []; 
                for(let i=0; i<rows; i++) { 
                    let rw = [...A[i]]; 
                    for(let j=0; j<rows; j++) { rw.push(i === j ? 1 : 0); }
                    ag.push(rw); 
                } 
                
                if(showSteps) htmlOut += rT(cln(ag), "[A | I]", true, rows);
                
                let l = 0, ps = true; 
                for(let r=0; r<rows; r++) { 
                    if(rows <= l) break; 
                    let i = r; 
                    while(Math.abs(ag[i][l]) < 1e-10) { 
                        i++; 
                        if(rows === i) { i = r; l++; if(rows === l) { ps = false; break; } } 
                    } 
                    if(!ps) break;
                    
                    if(i !== r) { 
                        let tp = ag[i]; ag[i] = ag[r]; ag[r] = tp; 
                        if(showSteps) htmlOut += rT(cln(ag), t('step_swap'), true, rows); 
                    } 
                    
                    let p = ag[r][l];
                    if(Math.abs(p - 1) > 1e-10) { 
                        for(let j=0; j<rows*2; j++) { ag[r][j] /= p; }
                        if(showSteps) htmlOut += rT(cln(ag), t('step_div_p').replace('{p}', fN(p)), true, rows); 
                    } 
                    
                    let el = false;
                    for(let k=0; k<rows; k++) { 
                        if(k !== r) { 
                            let f = ag[k][l]; 
                            if(Math.abs(f) > 1e-10) { 
                                for(let j=0; j<rows*2; j++) { ag[k][j] -= f * ag[r][j]; }
                                el = true; 
                            } 
                        } 
                    } 
                    if(showSteps && el) htmlOut += rT(cln(ag), t('step_elim_p'), true, rows); 
                    l++;
                }
                
                if(!ps) { 
                    htmlOut += `<div class="result-box" style="color:var(--danger-color);">${t('no_sol')} (Det = 0)</div>`; 
                } else { 
                    let I = []; 
                    for(let i=0; i<rows; i++) { I.push(ag[i].slice(rows)); }
                    if(!showSteps) {
                        htmlOut += rT(I, t('step_res')); 
                    } else {
                        htmlOut += `<div class="result-box">${t('step_inv_ext')}</div>` + rT(I, `A<sup>-1</sup>`); 
                    }
                }
            }
            
            s.innerHTML = htmlOut; 
            s.scrollIntoView({ behavior: 'smooth' });
        }
        
        window.onload = () => changeLanguage();
    </script>
</body>
</html>
